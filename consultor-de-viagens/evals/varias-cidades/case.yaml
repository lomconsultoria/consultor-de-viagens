schema_version: "1.1"
name: varias-cidades
expected_outcome: |
  A resposta trata a viagem como trechos em sequência (CWB→SCL, SCL→BUE, BUE→CWB), compara com um bilhete multi-city, mostra preço por pessoa à vista e no cartão com parcelas e juros por vendedor, verifica exigências de documentos em fonte oficial e declara as premissas assumidas (datas, bagagem).
