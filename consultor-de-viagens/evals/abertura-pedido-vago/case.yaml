schema_version: "1.1"
name: abertura-pedido-vago
expected_outcome: |
  A resposta é uma única pergunta aberta e acolhedora, pedindo origem, destino, datas, quem vai (adultos e crianças), bagagem, orçamento, o que já está reservado, milhas e forma de pagamento. Não pesquisa preços antes da resposta e não assume a cidade de origem.
